<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes radarWave {
        0% { r: 20px; opacity: 0.8; }
        100% { r: 140px; opacity: 0; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #ffd700); }
      }

      .pulse-item {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .card-1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .card-2 {
        animation: floatCard2 6s ease-in-out infinite;
      }
      .radar-1 {
        animation: radarWave 3s cubic-bezier(0.1, 0.5, 0.9, 1) infinite;
        transform-origin: 980px 210px;
      }
      .radar-2 {
        animation: radarWave 3s cubic-bezier(0.1, 0.5, 0.9, 1) infinite;
        animation-delay: 1.5s;
        transform-origin: 980px 210px;
      }
      .star-anim {
        animation: starTwinkle 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .star-d1 { animation-delay: 0.2s; }
      .star-d2 { animation-delay: 0.4s; }
      .star-d3 { animation-delay: 0.6s; }
      .star-d4 { animation-delay: 0.8s; }
      .star-d5 { animation-delay: 1.0s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="210" r="220" fill="#a18cd1" opacity="0.10" filter="url(#glow)" />
  <circle cx="650" cy="350" r="160" fill="#fda085" opacity="0.05" filter="url(#glow)" />

  <!-- Radar Monitoring Visual (Right Area) -->
  <g transform="translate(980, 210)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="130" stroke="rgba(79, 172, 254, 0.15)" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="95" stroke="rgba(79, 172, 254, 0.25)" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="60" stroke="rgba(79, 172, 254, 0.35)" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="25" stroke="rgba(0, 242, 254, 0.6)" stroke-width="2" fill="none" />
    
    <!-- Dynamic Radar Waves -->
    <circle class="radar-1" cx="0" cy="0" r="20" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0" />
    <circle class="radar-2" cx="0" cy="0" r="20" stroke="#4facfe" stroke-width="2" fill="none" opacity="0" />

    <!-- Center Trust Shield Icon -->
    <g transform="translate(-24, -28) scale(1.6)">
      <path d="M15 2 L4 6 V14 C4 20 15 26 15 26 C15 26 26 20 26 14 V6 L15 2 Z" fill="url(#accentCyan)" filter="url(#glow)" opacity="0.9" />
      <path d="M11 13 L14 16 L20 10" fill="none" stroke="#070a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="-65" cy="-45" r="5" fill="#ffd700" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="50" r="6" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="-40" cy="75" r="4.5" fill="#fbc2eb" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Metric Card 1 (Top Right) -->
  <g class="card-1" transform="translate(800, 55)" filter="url(#cardShadow)">
    <rect width="260" height="68" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    <circle cx="36" cy="34" r="18" fill="rgba(0, 242, 254, 0.15)" />
    <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle" fill="#00f2fe">📈</text>
    <text x="68" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a0aec0">SENTIMENT INDEX</text>
    <text x="68" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">98.4% Positive</text>
  </g>

  <!-- Floating Metric Card 2 (Bottom Right) -->
  <g class="card-2" transform="translate(740, 295)" filter="url(#cardShadow)">
    <rect width="280" height="72" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    <circle cx="38" cy="36" r="18" fill="rgba(246, 211, 101, 0.15)" />
    <text x="38" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle" fill="#f6d365">⭐</text>
    <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a0aec0">REPUTATION RATING</text>
    <text x="70" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffd700">4.9 / 5.0 (Omnichannel)</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Tag -->
    <rect width="275" height="34" rx="17" fill="rgba(79, 172, 254, 0.12)" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#00f2fe" class="pulse-item" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#00f2fe">AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Reputation Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
      Curated Directory of Commercial SaaS &amp; Open-Source Tools for Review Monitoring,
    </text>
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
      Automated Response, Listings Management, and Sentiment Analysis
    </text>

    <!-- Five Golden Stars -->
    <g transform="translate(0, 190)">
      <g class="star-anim star-d1" transform="translate(0, 0)">
        <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#ffd700" />
      </g>
      <g class="star-anim star-d2" transform="translate(28, 0)">
        <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#ffd700" />
      </g>
      <g class="star-anim star-d3" transform="translate(56, 0)">
        <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#ffd700" />
      </g>
      <g class="star-anim star-d4" transform="translate(84, 0)">
        <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#ffd700" />
      </g>
      <g class="star-anim star-d5" transform="translate(112, 0)">
        <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#ffd700" />
      </g>
      <text x="148" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Trusted Online Reputation Architecture
      </text>
    </g>

    <!-- Key Feature Pills / Highlights -->
    <g transform="translate(0, 240)">
      <rect width="140" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="70" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#cbd5e1">📡 Social Listening</text>

      <g transform="translate(152, 0)">
        <rect width="156" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="78" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#cbd5e1">💬 Review Generation</text>
      </g>

      <g transform="translate(320, 0)">
        <rect width="158" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="79" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#cbd5e1">🧠 Sentiment Analysis</text>
      </g>

      <g transform="translate(490, 0)">
        <rect width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="72" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#cbd5e1">📍 Local Listings</text>
      </g>
    </g>
  </g>
</svg>
